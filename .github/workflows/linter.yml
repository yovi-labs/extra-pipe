name: Verify Extra Pipe

on:
  push:
    branches: ['develop', 'main', 'release/**']
  pull_request:
    branches: ['develop', 'main', 'release/**']
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  angular-17:
    name: Angular 17 library and demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Lint library
        run: npm run lint:lib

      - name: Test library
        run: npm run test:ci

      - name: Build library
        run: npm run build:lib

      - name: Build Angular 17 demo
        run: npm run build:demo17

      - name: Verify package contents
        run: npm run check:package

      - name: Prepare package destination
        run: mkdir -p dist/extra-pipe-package

      - name: Pack library
        run: npm pack --pack-destination ../extra-pipe-package
        working-directory: dist/extra-pipe

      - name: Upload packed library
        uses: actions/upload-artifact@v4
        with:
          name: extra-pipe-package
          path: dist/extra-pipe-package/extra-pipe-*.tgz
          if-no-files-found: error

  website:
    name: Angular 22 static website
    needs: angular-17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/test-app/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: extra-pipe-package
          path: package
      - run: npm ci --ignore-scripts
        working-directory: projects/test-app
      - run: npm install --no-save --package-lock=false --ignore-scripts ../../package/extra-pipe-*.tgz
        working-directory: projects/test-app
      - run: npm run test:ci
        working-directory: projects/test-app
      - run: npm run build
        working-directory: projects/test-app
      - name: Verify static response security and redirects
        run: node --test scripts/website-security.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: website-static
          path: projects/test-app/dist/extra-pipe-website/browser
          if-no-files-found: error

  consumers:
    name: Angular ${{ matrix.angular }} packed consumer
    needs: angular-17
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { angular: 17, node: 20 }
          - { angular: 18, node: 20 }
          - { angular: 19, node: 20 }
          - { angular: 20, node: 22 }
          - { angular: 21, node: 22 }
          - { angular: 22, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: extra-pipe-package
          path: package
      - name: Build clean standalone consumer
        run: npm run check:compat -- ${{ matrix.angular }} package

  performance:
    name: Three-run mobile Lighthouse
    needs: website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: website-static
          path: projects/test-app/dist/extra-pipe-website/browser
      - run: npm ci --prefix tools/quality --ignore-scripts
      - name: Serve verified static artifact
        run: node scripts/serve-static.mjs &
      - name: Check median mobile performance
        run: npm run check:performance
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-mobile
          path: .artifacts/lighthouse
